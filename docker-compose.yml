# Frontend, backend and database together (backend design → Configuration and Docker).
# The api port is published only for debugging; the browser reaches the API through Next.js.
# The database port is not published to the host.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes: [ "pgdata:/var/lib/postgresql/data" ]
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}" ]
      interval: 10s
      retries: 5
    restart: unless-stopped

  api:
    build: ./backend
    env_file: .env
    depends_on:
      db: { condition: service_healthy }
    ports: [ "3000:3000" ]
    restart: unless-stopped

  web:
    build: ./frontend          # Next.js standalone server; forwards /api/* to the api service
    environment:
      API_INTERNAL_URL: http://api:3000
      COOKIE_SECURE: ${COOKIE_SECURE:-true}   # set "false" only for plain-http local runs
    depends_on: [ api ]
    ports: [ "8080:3000" ]
    restart: unless-stopped

  # End-to-end tests only: docker compose --profile test up
  mock-target:
    build: ./mock-target
    profiles: [ "test" ]
    ports: [ "4000:4000" ]

# To run the runner separately later, add a second api service with RUNNER_ENABLED=true and
# set it to false on the web-facing one; the advisory lock keeps hits sequential either way.

volumes:
  pgdata:
